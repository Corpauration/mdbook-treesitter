[package]
name = "mdbook-treesitter"
version = "1.1.0"
description = "mdBook preprocessor to add tree-sitter highlighting support"
homepage = "https://github.com/Corpauration/mdbook-treesitter"
repository = "https://github.com/Corpauration/mdbook-treesitter"
keywords = ["mdbook", "tree-sitter"]
categories = ["parsing"]
edition = "2024"
license = "MIT"

[[bin]]
name = "mdbook-treesitter"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "mdbook_treesitter"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
html-escape = "0.2"
libloading = "0.9"
mdbook-markdown = "0.5"
mdbook-preprocessor = { version = "0.5", default-features = false }
phf = { version = "0.13", features = ["macros"] }
regex = "1"
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"

[features]
default = ["cli"]

cli = []

[lints]
[lints.rust]
# we need to interact with tree-sitter
unsafe_code = "allow"
[lints.rustdoc]
all = "warn"
[lints.clippy]
pedantic = { priority = -1, level = "warn" }
nursery = { priority = -1, level = "warn" }
# cargo = { priority = -1, level = "warn" }
